name: Publish to ClawHub

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
      - OAUTH_SETUP.md
      - .clawhubignore
      - docs/MACHINE_CONTRACT.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawhub-publish-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install clawhub CLI
        run: npm install -g clawhub@0.24.1

      - name: Authenticate clawhub
        run: clawhub login --token "$CLAWHUB_TOKEN"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish skill
        run: clawhub skill publish . --owner stozo04 --slug google-health-cli --name "Google Health"
