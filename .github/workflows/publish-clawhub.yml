name: Publish to ClawHub

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
      - OAUTH_SETUP.md
      - .clawhubignore
      - docs/MACHINE_CONTRACT.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install clawhub CLI
        run: npm install -g clawhub

      - name: Authenticate clawhub
        run: clawhub login --token "$CLAWHUB_TOKEN"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish skill
        run: clawhub skill publish . --owner stozo04 --slug google-health-cli --name "Google Health"
