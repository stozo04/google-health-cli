name: Publish to ClawHub

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
      - OAUTH_SETUP.md
      - .clawhubignore
      - docs/MACHINE_CONTRACT.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawhub-publish-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check what clawhub would publish
        run: make check-clawhub

      - name: Install clawhub CLI
        run: npm install -g clawhub@0.26.0

      - name: Authenticate clawhub
        run: clawhub login --token "$CLAWHUB_TOKEN"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish skill
        run: scripts/publish-clawhub.sh google-health-cli stozo04 "Google Health"
